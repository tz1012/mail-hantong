name: mail-hantong Unix packages

on:
  push:
    branches: [feature/linux-product-20261104]
    paths: [.github/workflows/unix-package.yml]
  workflow_dispatch:
    inputs:
      version:
        description: Release prerelease version to package
        required: true
        default: 0.1.0-beta.24
        type: string

permissions:
  contents: read

jobs:
  package-macos:
    name: package macOS (${{ matrix.release_target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            release_target: macos-x86_64
          - runner: macos-15
            target: aarch64-apple-darwin
            release_target: macos-aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      PACKAGE_VERSION: ${{ inputs.version || '0.1.0-beta.24' }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false
      - name: Set up pinned Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Install pinned Rust toolchain and target
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup target add ${{ matrix.target }} --toolchain 1.95.0
          rustup default 1.95.0
          rustup component add clippy --toolchain 1.95.0
      - name: Restore native build cache
        uses: actions/cache/restore@v6.1.0
        id: cargo-cache
        with:
          path: |
            ~/.cargo/registry
            target
          key: native-1.95.0-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: native-1.95.0-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}-
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Verify source traceability and license provenance
        run: |
          python -X utf8 scripts/traceability.py --check
          test -s packaging/licenses/index.json
      - name: Check native Unix integration
        run: |
          cargo clippy --workspace --all-targets --locked --offline -- -D warnings
          cargo test -p hantong-secrets --lib --locked --offline google:: -- --test-threads=1
          cargo test -p mail-hantong-core --bin mail-hantong-core --locked --offline unix_google -- --test-threads=1
          cargo test -p mail-hantong-core --bin mail-hantong-core --locked --offline unix_terminal_review_frontend -- --test-threads=1
          cargo test -p hantong-secrets --lib --locked --offline unix_database::tests -- --test-threads=1
          cargo test -p mail-hantong-core --bin mail-hantong-core --locked --offline unix_core_runtime -- --test-threads=1
          cargo test -p hantong-secrets --lib --locked --offline terminal_secret -- --test-threads=1
          cargo test -p mail-hantong-core --bin mail-hantong-core --locked --offline unix_stop
          cargo test -p hantong-mcp --all-targets --locked --offline
          cargo test -p hantong-store --lib --locked --offline unix_schema_tests -- --test-threads=1
          cargo test -p hantong-approval -p hantong-secrets -p mail-hantong-core --all-targets --locked --offline mcp07 -- --test-threads=1
          cargo test -p hantong-contracts -p hantong-ipc-client -p hantong-ipc-server --lib --locked --offline mcp -- --test-threads=1
      - name: Download and isolate reviewed publisher asset
        env:
          PUBLISHER_URL: https://github.com/tz1012/mail-hantong/releases/download/v0.1.0-beta.21/mail-hantong-cli-0.1.0-beta.21-windows-x86_64.zip
          PUBLISHER_SHA256: b6d15b610ef74e63e17f881a4a01802ac22cecc49bf69b0059664142b3c370fc
        run: |
          archive="$RUNNER_TEMP/publisher-beta21.zip"
          asset="$RUNNER_TEMP/google-desktop.json"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            --connect-timeout 15 --max-time 300 --max-filesize 268435456 "$PUBLISHER_URL" --output "$archive"
          python -X utf8 scripts/prepare_public_publisher.py \
            --archive "$archive" --output "$asset" --expected-sha256 "$PUBLISHER_SHA256"
      - name: Run synthetic Unix installer checks
        run: python -X utf8 scripts/test_linux_installer.py
      - name: Build and package native Unix artifact
        run: |
          python -X utf8 scripts/package_unix.py \
            --version "$PACKAGE_VERSION" \
            --output-dir "$RUNNER_TEMP/artifacts" \
            --publisher-config "$RUNNER_TEMP/google-desktop.json"
      - name: Prepare isolated CI Keychain
        run: |
          security default-keychain -d user | sed 's/^[[:space:]]*"//; s/"[[:space:]]*$//' > "$RUNNER_TEMP/hantong-original-keychain"
          security create-keychain -p 'synthetic-ci-only' "$RUNNER_TEMP/hantong-ci.keychain-db"
          security unlock-keychain -p 'synthetic-ci-only' "$RUNNER_TEMP/hantong-ci.keychain-db"
          security set-keychain-settings -lut 1800 "$RUNNER_TEMP/hantong-ci.keychain-db"
          security default-keychain -d user -s "$RUNNER_TEMP/hantong-ci.keychain-db"
      - name: Smoke test the installed macOS product
        run: |
          python -X utf8 scripts/test_macos_installed_product.py \
            --package-dir "$RUNNER_TEMP/artifacts/$PACKAGE_VERSION" \
            --version "$PACKAGE_VERSION"
      - name: Restore CI Keychain
        if: always()
        run: |
          if [ -s "$RUNNER_TEMP/hantong-original-keychain" ]; then
            security default-keychain -d user -s "$(cat "$RUNNER_TEMP/hantong-original-keychain")"
          fi
          if [ -f "$RUNNER_TEMP/hantong-ci.keychain-db" ]; then
            security delete-keychain "$RUNNER_TEMP/hantong-ci.keychain-db"
          fi
      - name: Upload package artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: mail-hantong-${{ env.PACKAGE_VERSION }}-${{ matrix.release_target }}
          path: ${{ runner.temp }}/artifacts/${{ env.PACKAGE_VERSION }}/
          if-no-files-found: error
          retention-days: 14
      - name: Save native build cache
        if: always() && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            target
          key: native-1.95.0-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
