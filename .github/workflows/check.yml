name: mail-hantong checks

on:
  push:
  pull_request:
  workflow_dispatch:

# The workflow only needs to read the checked-out source. No secrets or write token
# are available to the build and test commands.
permissions:
  contents: read

jobs:
  check:
    name: checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2025
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
      - name: Fetch Cargo dependencies
        run: cargo fetch --locked
      - name: Prepare verified Windows native tools
        if: runner.os == 'Windows'
        run: python scripts/prepare_native_tools.py
      - name: Run repository checks offline
        run: python scripts/check_all.py

  ci-required:
    name: CI required
    if: ${{ always() }}
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Require every platform check
        env:
          MATRIX_RESULT: ${{ needs.check.result }}
        run: |
          if [ "$MATRIX_RESULT" != "success" ]; then
            echo "Platform checks result: $MATRIX_RESULT"
            exit 1
          fi
          echo "All platform checks passed."
