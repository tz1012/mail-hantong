[package]
name = "hantong-approval-windows"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish = false

[lints.rust]
unsafe_code = "allow"
unsafe_op_in_unsafe_fn = "deny"

[dependencies]
hantong-approval = { path = "../hantong-approval" }
hantong-contracts = { path = "../hantong-contracts" }
hantong-domain = { path = "../hantong-domain" }
hantong-secrets = { path = "../hantong-secrets" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_SystemServices"] }
hantong-platform = { path = "../hantong-platform" }
tokio = { version = "=1.54.1", default-features = false, features = ["sync"] }
windows = { version = "=0.62.2", default-features = false, features = ["std", "Security_Credentials_UI", "UI_ViewManagement", "Win32_Foundation", "Win32_System_WinRT", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls", "Win32_UI_Accessibility", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Time", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_Globalization"] }
windows-future = { version = "=0.3.2", default-features = false, features = ["std"] }

[target.'cfg(windows)'.dev-dependencies]
tokio = { version = "=1.54.1", features = ["rt", "macros"] }
