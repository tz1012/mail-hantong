[package]
name = "hantong-store"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
hantong-contracts = { path = "../hantong-contracts" }
hantong-domain = { path = "../hantong-domain" }
hantong-secrets = { path = "../hantong-secrets" }
serde_json = "1.0.154"

[target.'cfg(windows)'.dependencies]
hantong-platform = { path = "../hantong-platform" }
rusqlite = { version = "=0.41.1", default-features = false, features = [
    "bundled-sqlcipher-vendored-openssl",
    "backup",
] }
