[package]
name = "hantong-ipc-client"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
hantong-contracts = { path = "../hantong-contracts" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[target.'cfg(windows)'.dependencies]
hantong-platform = { path = "../hantong-platform" }
tokio = { version = "1.54.1", default-features = false, features = ["rt", "net", "io-util", "time"] }
