[package]
name = "hantong-secrets"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish = false

[lints]
[lints.rust]
unsafe_code = "allow"
unsafe_op_in_unsafe_fn = "deny"

[dependencies]
hantong-contracts = { path = "../hantong-contracts" }
hantong-domain = { path = "../hantong-domain" }

serde_json = "=1.0.154"

[target.'cfg(unix)'.dependencies]
hantong-platform = { path = "../hantong-platform" }
libc = "=0.2.191"
keyring-core = "=1.0.1"
ring = "=0.17.14"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "=1.0.2", features = ["keychain"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { version = "=1.0.1", features = ["crypto-rust"] }

[target.'cfg(any(windows, target_os = "linux", target_os = "macos"))'.dev-dependencies]
tokio = { version = "=1.54.1", features = ["test-util"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Networking_WinHttp",
    "Win32_Security_Cryptography",
    "Win32_Storage",
    "Win32_Storage_FileSystem",
    "Win32_Graphics_Gdi",
    "Win32_System_Threading",
    "Win32_System_Console",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Controls",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
] }

[target.'cfg(any(windows, target_os = "linux", target_os = "macos"))'.dependencies]
io-imap = { version = "=0.7.1", default-features = false, features = ["client", "scram"] }
# Published imap-codec disables nom defaults without selecting its required alloc feature.
nom = { version = "=7.1.3", default-features = false, features = ["alloc"] }
log = { version = "=0.4.34", default-features = false, features = ["max_level_off"] }
tokio = { version = "=1.54.1", features = ["rt", "net", "time", "io-util", "macros"] }
lettre = { version = "=0.11.23", default-features = false, features = ["smtp-transport", "tokio1", "tokio1-rustls", "rustls-platform-verifier", "ring"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12"] }
rustls-platform-verifier = { version = "=0.7.1" }
rusqlite = { version = "=0.41.1", default-features = false, features = ["bundled-sqlcipher-vendored-openssl", "backup"] }
