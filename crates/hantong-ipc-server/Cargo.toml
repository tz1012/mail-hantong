[package]
name = "hantong-ipc-server"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
hantong-contracts = { path = "../hantong-contracts" }
# Custom serde visitor/seed enforces duplicate-key and resource bounds.
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "io-util", "time", "macros"] }

[target.'cfg(windows)'.dependencies]
hantong-platform = { path = "../hantong-platform" }
