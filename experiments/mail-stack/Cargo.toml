[workspace]
resolver = "2"

[package]
name = "hantong-mail-stack-experiment"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
io-imap = { version = "=0.7.1", default-features = false, features = ["client", "scram"] }
lettre = { version = "=0.11.23", default-features = false, features = [
    "smtp-transport",
    "tokio1",
    "tokio1-rustls",
    "rustls-platform-verifier",
    "ring",
] }
mail-parser = { version = "=0.11.9", features = ["full_encoding"] }
mail-builder = { version = "=1.0.0", default-features = false }
tokio = { version = "=1.54.1", features = ["io-util", "macros", "rt", "time"] }

# io-imap 0.7.1's published imap-codec manifest disables nom defaults but does
# not enable nom's required alloc feature. Feature unification in this isolated
# experiment supplies that published dependency feature without patching or
# replacing imap-codec.
nom = { version = "=7.1.3", default-features = false, features = ["alloc"] }

[dev-dependencies]
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12"] }
