[package]
name = "mail-hantong-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "mail-hantong-core"
path = "src/main.rs"

[dependencies]
hantong-application = { path = "../../crates/hantong-application" }
 hantong-ipc-client = { path = "../../crates/hantong-ipc-client" }
hantong-contracts = { path = "../../crates/hantong-contracts" }
hantong-ipc-server = { path = "../../crates/hantong-ipc-server" }
hantong-platform = { path = "../../crates/hantong-platform" }
hantong-store = { path = "../../crates/hantong-store" }
tokio = { version = "1.54.1", features = ["rt", "net", "time", "signal", "macros"] }
serde_json = "1.0.154"
